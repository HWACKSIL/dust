<!DOCTYPE html>
<!-- 한국어 문서 설정 -->
<html lang="ko">
<head>
  <!-- 문자 인코딩 설정 (UTF-8) -->
  <meta charset="UTF-8">
  <!-- 모바일 및 반응형 뷰포트 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 웹페이지 제목 -->
  <title>실시간 대기오염 정보 조회</title>
  <!-- 스타일시트(CSS) 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 메인 컨테이너 영역 -->
  <div class="container">
    <!-- 헤더 타이틀 영역 -->
    <header class="header">
      <!-- 메인 제목 -->
      <h1>전국 실시간 대기오염 정보</h1>
      <!-- 부제목 설명 -->
      <p>한국환경공단 에어코리아 공공 API 기반 미세먼지 현황</p>
    </header>

    <!-- 컨트롤 및 요약 정보 영역 -->
    <section class="control-panel">
      <!-- 시도 선택 드롭다운 폼 그룹 -->
      <div class="form-group">
        <!-- 드롭다운 라벨 -->
        <label for="sidoSelect">지역 선택</label>
        <!-- 시도 선택 셀렉트 박스 -->
        <select id="sidoSelect">
          <!-- 전국 옵션 -->
          <option value="전국">전국</option>
          <!-- 서울 옵션 (기본 선택) -->
          <option value="서울" selected>서울</option>
          <!-- 부산 옵션 -->
          <option value="부산">부산</option>
          <!-- 대구 옵션 -->
          <option value="대구">대구</option>
          <!-- 인천 옵션 -->
          <option value="인천">인천</option>
          <!-- 광주 옵션 -->
          <option value="광주">광주</option>
          <!-- 대전 옵션 -->
          <option value="대전">대전</option>
          <!-- 울산 옵션 -->
          <option value="울산">울산</option>
          <!-- 세종 옵션 -->
          <option value="세종">세종</option>
          <!-- 경기 옵션 -->
          <option value="경기">경기</option>
          <!-- 강원 옵션 -->
          <option value="강원">강원</option>
          <!-- 충북 옵션 -->
          <option value="충북">충북</option>
          <!-- 충남 옵션 -->
          <option value="충남">충남</option>
          <!-- 전북 옵션 -->
          <option value="전북">전북</option>
          <!-- 전남 옵션 -->
          <option value="전남">전남</option>
          <!-- 경북 옵션 -->
          <option value="경북">경북</option>
          <!-- 경남 옵션 -->
          <option value="경남">경남</option>
          <!-- 제주 옵션 -->
          <option value="제주">제주</option>
        </select>
      </div>

      <!-- 지역 평균 미세먼지 수치 카드 -->
      <div class="summary-card">
        <!-- 평균 수치 라벨 -->
        <span class="summary-title"><span id="currentRegionText">서울</span> 평균 미세먼지 (PM10)</span>
        <!-- 큰 글자 평균값 표시부 -->
        <div class="summary-value" id="avgPm10">- <span class="unit">µg/m³</span></div>
        <!-- 평균 상태 텍스트 -->
        <span class="summary-status" id="avgStatus">측정 대기 중</span>
      </div>
    </section>

    <!-- 등급 안내 뱃지 영역 -->
    <div class="grade-legend">
      <!-- 파랑: 좋음 -->
      <span class="legend-badge grade-good">좋음 (1)</span>
      <!-- 초록: 보통 -->
      <span class="legend-badge grade-normal">보통 (2)</span>
      <!-- 주황: 나쁨 -->
      <span class="legend-badge grade-bad">나쁨 (3)</span>
      <!-- 빨강: 매우나쁨 -->
      <span class="legend-badge grade-very-bad">매우나쁨 (4)</span>
      <!-- 회색: 측정안됨/미제공 -->
      <span class="legend-badge grade-unknown">측정안됨 / 미제공</span>
    </div>

    <!-- 로딩 스피너 및 알림 메시지 영역 -->
    <div id="loadingStatus" class="loading-status">데이터를 불러오는 중입니다...</div>

    <!-- 측정소별 카드 그리드 컨테이너 -->
    <main id="stationGrid" class="station-grid"></main>
  </div>

  <!-- 자바스크립트(JS) 파일 연결 -->
  <script src="script.js"></script>
</body>
</html>
